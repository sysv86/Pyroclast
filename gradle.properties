# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# If your IDE picks the wrong JDK, point Gradle at a JDK 25 installation explicitly:
# org.gradle.java.home=/path/to/jdk-25

# Fabric (https://fabricmc.net/develop)
minecraft_version=26.3
loader_version=0.20.1

# Fabric API is not a dependency yet: nothing in the mod uses it. Add it back (and to
# fabric.mod.json "depends") at the moment the first API class is actually referenced.
# fabric_api_version=0.165.2+26.3

# Kotlin runtime. The compiler version lives in build.gradle.kts and must match the suffix here,
# otherwise the compiler and the bundled stdlib disagree at runtime.
fabric_kotlin_version=1.14.2+kotlin.2.4.21

# Mod
mod_version=0.1.0-alpha.1
maven_group=dev.vulkanturbo
archives_base_name=vulkanturbo
