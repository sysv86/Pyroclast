name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: pyroclast-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build
        run: ./gradlew test build --no-daemon

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/libs/*.jar dist/
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)

      - name: Sign release artifacts
        env:
          GPG_KEY: ${{ secrets.SIGNING_GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.SIGNING_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$GPG_KEY" ]; then
            echo "SIGNING_GPG_PRIVATE_KEY secret is not configured; skipping signature step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_KEY" | gpg --batch --import --quiet
          for f in dist/*.jar dist/SHA256SUMS.txt; do
            if [ -n "$GPG_PASS" ]; then
              printf '%s' "$GPG_PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$f"
            else
              gpg --batch --yes --armor --detach-sign "$f"
            fi
          done
          rm -rf "$GNUPGHOME"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
