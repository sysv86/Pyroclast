name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pyroclast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Fabric Mod (JDK 25 test & build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Verify benchmark harness syntax and Java agent compilation
        run: |
          set -euo pipefail
          python3 -m py_compile bench/compare.py
          mkdir -p build/bench-agent-check
          javac --release 25 -d build/bench-agent-check bench/agent/*.java

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vulkanturbo-test-reports
          path: build/reports/tests/
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulkanturbo-jars
          path: build/libs/*.jar
          retention-days: 14
