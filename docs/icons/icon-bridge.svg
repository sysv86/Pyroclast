        <path d="M144 48h96v16h-96Z M144 64h96v16h-96Z M144 80h32v16h-32Z M208 80h32v16h-32Z M208 96h32v16h-32Z M208 112h32v16h-32Z M144 128h32v16h-32Z M208 128h32v16h-32Z M144 144h96v16h-96Z M144 160h96v16h-96Z" fill="url(#accent)"/>
